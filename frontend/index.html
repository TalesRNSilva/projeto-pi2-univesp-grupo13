<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obral — Visualização Geral</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> -->
</head>
<body>
  <nav class="navbar">
    <a class="brand-lockup" href="index.html" aria-label="Obral, Gestão pra Toda Obra">
      <span class="brand-mark" aria-hidden="true">O</span>
      <span class="brand-copy"><strong>Obral</strong><small>Gestão pra Toda Obra</small></span>
    </a>
    <div class="nav-links">
      <a href="index.html" class="ativo" aria-current="page">Obras</a>
      <a href="cadastro.html">Cadastrar</a>
      <a href="responsaveis.html">Responsáveis</a>
    </div>
  </nav>

  <main class="page-shell">
    <section class="stats-grid" aria-label="Resumo das obras">
      <article class="stat-card">
        <strong class="stat-value" id="total-obras">0</strong>
        <span class="stat-label">Total de Obras</span>
      </article>
      <article class="stat-card stat-card-success">
        <strong class="stat-value" id="total-concluidas">0</strong>
        <span class="stat-label">Concluídas</span>
      </article>
      <article class="stat-card stat-card-info">
        <strong class="stat-value" id="total-andamento">0</strong>
        <span class="stat-label">Em Andamento</span>
      </article>
      <article class="stat-card stat-card-warning">
        <strong class="stat-value" id="total-encerradas">0</strong>
        <span class="stat-label">Encerradas</span>
      </article>
    </section>

    <section class="projects-section" aria-labelledby="projects-title">
      <div class="section-heading">
        <h1 id="projects-title">Projetos de Obra</h1>
        <div class="heading-actions">
          <button class="button button-secondary" id="exportar-obras" type="button">
            Exportar Dados
          </button>
          <a class="button button-primary" href="cadastro.html"><span aria-hidden="true">+</span> Nova Obra</a>
        </div>
      </div>
      <section class="obra-filters" id="filtros-obras" aria-label="Filtros e ordenação">
        <div class="filter-group">
          <h2>Ordenar por</h2>
          <div class="pill-list" role="group" aria-label="Campo de ordenação">
            <button class="filter-pill" type="button" data-sort="id" aria-pressed="false">ID <span class="sort-arrow" aria-hidden="true"></span></button>
            <button class="filter-pill" type="button" data-sort="data_conclusao" aria-pressed="false">Previsão <span class="sort-arrow" aria-hidden="true"></span></button>
            <button class="filter-pill is-active" type="button" data-sort="ultima_atualizacao" aria-pressed="true">Última atualização <span class="sort-arrow" aria-hidden="true">↓</span></button>
          </div>
        </div>
        <div class="filter-group">
          <h2>Status</h2>
          <div class="pill-list" role="group" aria-label="Filtro por status">
            <button class="filter-pill" type="button" data-status="Não iniciado" aria-pressed="false">Não iniciado</button>
            <button class="filter-pill" type="button" data-status="Em andamento" aria-pressed="false">Em andamento</button>
            <button class="filter-pill" type="button" data-status="Concluído" aria-pressed="false">Concluído</button>
            <button class="filter-pill" type="button" data-status="Encerrado" aria-pressed="false">Encerrado</button>
          </div>
        </div>
        <button class="button button-secondary" type="button" id="limpar-filtros">Limpar filtros</button>
      </section>
      <div id="lista-obras" class="project-list" aria-live="polite"></div>
      <p class="list-caption" id="list-caption"></p>
      <nav class="pagination" id="paginacao-obras" aria-label="Paginação das obras" hidden></nav>
    </section>
  </main>

  <footer>Trabalho acadêmico — Univesp</footer>

  <script src="js/api.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
