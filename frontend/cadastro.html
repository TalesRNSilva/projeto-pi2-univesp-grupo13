<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obral — Obra</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> -->
</head>
<body>
  <nav class="navbar">
    <a class="brand-lockup" href="index.html" aria-label="Obral, Gestão pra Toda Obra">
      <span class="brand-mark" aria-hidden="true">O</span>
      <span class="brand-copy"><strong>Obral</strong><small>Gestão pra Toda Obra</small></span>
    </a>
    <div class="nav-links">
      <a href="index.html">Obras</a>
      <a href="cadastro.html" class="ativo" aria-current="page">Cadastrar</a>
      <a href="responsaveis.html">Responsáveis</a>
    </div>
  </nav>

  <main>
    <h1 id="titulo-formulario">Cadastrar Obra</h1>
    <form id="form-obra">
      <section class="form-section"><h2>Identificação do projeto</h2>
        <div class="form-grid">
          <label>Projeto *<input name="projeto" required minlength="3" maxlength="100"></label>
          <label>Responsável *<span class="inline-field"><select name="id_responsavel" id="responsavel" required></select><button class="button button-secondary" id="novo-responsavel" type="button">Novo</button></span></label>
          <label>Data de início *<input name="data_inicio" type="date" required></label>
          <label>Previsão de conclusão *<input name="data_conclusao" type="date" required></label>
          <label>Status *<select name="status" required><option>Não iniciado</option><option>Em andamento</option><option>Concluído</option><option>Encerrado</option></select></label>
          <label>Orçamento<input name="orcamento" type="number" min="0" step="0.01"></label>
        </div>
      </section>
      <section class="form-section"><h2>Detalhes adicionais</h2><div class="form-grid">
        <label>Endereço<input name="endereco" maxlength="250"></label><label class="form-wide">Descrição<textarea name="descricao" maxlength="500"></textarea></label>
      </div></section>
      <section class="form-section"><h2>Informações do contratante</h2><div class="form-grid">
        <label>Nome<input name="contratante" minlength="3" maxlength="100"></label><label>Telefone<input name="telefone" type="tel" placeholder="(XX) XXXXX-XXXX"></label><label>E-mail<input name="email_contratante" type="email" maxlength="100"></label>
      </div></section>
      <p id="mensagem-form" class="form-message" role="alert"></p>
      <div class="form-actions"><a class="button button-secondary" href="index.html">Cancelar</a><button class="button button-primary" type="submit">Salvar obra</button></div>
    </form>
    <dialog id="modal-responsavel"><form method="dialog" id="form-responsavel"><h2>Novo responsável</h2>
      <label>Nome *<input name="nome" required minlength="3" maxlength="100"></label><label>E-mail<input name="email" type="email" maxlength="100"></label>
      <div class="form-actions"><button class="button button-secondary" value="cancel">Cancelar</button><button class="button button-primary" value="save">Cadastrar</button></div>
    </form></dialog>
  </main>

  <footer>Trabalho acadêmico — Univesp</footer>

  <script src="js/api.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
