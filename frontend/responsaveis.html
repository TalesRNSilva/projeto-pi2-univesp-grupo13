<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obral — Responsáveis</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> -->
</head>
<body>
  <nav class="navbar">
    <a class="brand-lockup" href="index.html" aria-label="Obral, Gestão pra Toda Obra">
      <span class="brand-mark" aria-hidden="true">O</span>
      <span class="brand-copy"><strong>Obral</strong><small>Gestão pra Toda Obra</small></span>
    </a>
    <div class="nav-links">
      <a href="index.html">Obras</a>
      <a href="cadastro.html">Cadastrar</a>
      <a href="responsaveis.html" class="ativo" aria-current="page">Responsáveis</a>
    </div>
  </nav>

  <main>
    <h1>Responsáveis</h1>
    <form id="form-responsavel" class="inline-form"><label>Nome *<input name="nome" required minlength="3" maxlength="100"></label><label>E-mail<input name="email" type="email" maxlength="100"></label><button class="button button-primary" type="submit">Cadastrar</button></form>
    <p id="mensagem-responsaveis" class="form-message" role="alert"></p><div id="lista-responsaveis" class="responsaveis-list">Carregando...</div>
    <dialog id="modal-edicao"><form method="dialog" id="form-edicao"><h2>Editar responsável</h2><input type="hidden" name="id"><label>Nome *<input name="nome" required minlength="3" maxlength="100"></label><label>E-mail<input name="email" type="email" maxlength="100"></label><div class="form-actions"><button class="button button-secondary" value="cancel">Cancelar</button><button class="button button-primary" value="save">Salvar</button></div></form></dialog>
  </main>

  <footer>Trabalho acadêmico — Univesp</footer>

  <script src="js/api.js"></script>
  <script src="js/responsaveis.js"></script>
</body>
</html>
